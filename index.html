<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Builder | Study Smart | Kula Revise</title>
<style>
  /* Kula Revise identity: pink ground, deep teal ink.
     Accent one (pink): navigation, progress, option letters, the hook marker, time taken in.
     Accent two (teal): anything the learner earned or chose. best answers, the plan, time got out. */
  :root {
    --sand: #FCDDEA; --paper: #FFFFFF; --cut: #FFF6FA; --ink: #0A2A2C;
    --a1: #CF1568;
    --a2: #0B5C61;
    --clay: #A80F55; --fade: #5A6B6E;
    --ink-c:10,42,44; --a1-c:207,21,104; --a2-c:11,92,97; --fade-c:90,107,110;
    --opt-correct-bg:#D5EEEA; --opt-wrong-bg:#F4E6EC; --chip-argue-bg:#F6E3EB; --chip-argue-fg:#A80F55;
    --on-ink:#FFFFFF; --on-a2:#FFFFFF; --mute1:#35494C; --mute2:#42575A; --ink-hover:#041A1B;
    --chip-instinct-bg:#FBE4EE; --sort-bg:rgba(252,221,234,0.35); --a2-hover:#084B4F;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --display: 'Anton', Impact, 'Arial Narrow', 'Roboto Condensed', sans-serif;
  }
  body.dark {
    --sand:#061A1C; --paper:#0C2729; --cut:#123235; --ink:#F7ECF1;
    --a1:#FF6FA8; --a2:#5ACDC2; --clay:#FF86B6; --fade:#8FA3A6;
    --ink-c:247,236,241; --a1-c:255,111,168; --a2-c:90,205,194; --fade-c:143,163,166;
    --opt-correct-bg:#0E403C; --opt-wrong-bg:#2B1A23; --chip-argue-bg:#1A3336; --chip-argue-fg:#FF86B6;
    --on-ink:#061A1C; --on-a2:#061A1C; --mute1:#BCCACC; --mute2:#AFBFC1; --ink-hover:#E8DAE1;
    --chip-instinct-bg:#173437; --sort-bg:rgba(255,255,255,0.05); --a2-hover:#74DBD1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      repeating-linear-gradient(90deg, rgba(var(--ink-c),0.028) 0 1px, transparent 1px 5px),
      radial-gradient(ellipse at top right, rgba(var(--a1-c),0.10) 0%, transparent 58%),
      radial-gradient(ellipse at bottom left, rgba(var(--a2-c),0.09) 0%, transparent 58%),
      var(--sand);
    padding: 1.6rem 1rem 3rem;
    font-family: var(--serif);
    color: var(--ink); line-height: 1.6; -webkit-text-size-adjust: 100%;
    -webkit-user-select: none; user-select: none;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .top-bar { margin-bottom: 1.6rem; }
  .top-meta { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.55rem; gap: 1rem; flex-wrap: wrap; }
  .top-count { color: var(--fade); font-weight: 500; letter-spacing: 0.04em; text-transform: none; }
  .track { height: 3px; background: rgba(var(--ink-c),0.12); overflow: hidden; }
  .fill { height: 100%; background: var(--a1); transition: width 0.35s ease; width: 0%; }

  /* Cover */
  .cover { text-align: center; padding: 1.2rem 0 1rem; }
  .cover-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 1.4rem; }
  .cover-title { font-size: clamp(2.3rem,7vw,3.6rem); font-weight: 800; line-height: 1.03; letter-spacing: -0.025em; margin-bottom: 1.3rem; }
  .flourish { width: 92px; height: 9px; margin: 0 auto 1.6rem;
    background:
      radial-gradient(circle at 9px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 46px 4.5px, var(--a1) 0 4px, transparent 4.5px),
      radial-gradient(circle at 83px 4.5px, var(--a1) 0 4px, transparent 4.5px); }
  .cover-line { font-size: 1.16rem; line-height: 1.7; color: var(--mute1); font-style: italic; max-width: 30rem; margin: 0 auto 2rem; min-height: 5.5rem; }
  .cover-line span { opacity: 0; transition: opacity 0.5s ease; }
  .cover-line span.vis { opacity: 1; }
  .cover-time { font-family: var(--sans); font-size: 0.8rem; color: var(--fade); margin-top: 1.4rem; letter-spacing: 0.02em; }
  .btn-begin { font-family: var(--sans); display: inline-flex; align-items: center; gap: 0.8rem; padding: 1.05rem 2.2rem; background: var(--ink); color: var(--on-ink); border: none; cursor: pointer; font-size: 1.12rem; font-weight: 700; }
  .btn-begin:hover { background: var(--ink-hover); }
  .btn-begin .sa { color: var(--a1); font-size: 1.3rem; }
  .skip-link { display: block; margin: 1.6rem auto 0; background: transparent; border: none; color: var(--fade); font-family: var(--sans); font-size: 0.84rem; cursor: pointer; text-decoration: underline; }

  /* Story hook */
  .story { padding: 0.6rem 0 0.4rem; min-height: 60vh; display: flex; flex-direction: column; justify-content: center; }
  .story-num { font-family: var(--serif); font-size: clamp(2.6rem,9vw,4rem); font-weight: 800; color: var(--a1); line-height: 1; letter-spacing: -0.02em; }
  .story-unit { font-family: var(--sans); font-size: 0.82rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fade); font-weight: 700; margin-top: 0.5rem; }
  .story-rule { width: 100%; height: 1px; background: rgba(var(--ink-c),0.22); margin: 1.4rem 0 1.6rem; }
  .story-line { font-size: 1.24rem; line-height: 1.66; margin-bottom: 1.05rem; opacity: 0; transform: translateY(6px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .story-line.vis { opacity: 1; transform: translateY(0); }
  .story-line.last { color: var(--a2); font-style: italic; font-weight: 600; }

  /* Content cards */
  .card { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); border-left: 5px solid var(--a1); padding: 1.7rem 1.5rem; margin-bottom: 1.3rem; }
  .stage-tag { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.9rem; }
  .card h2 { font-family: var(--sans); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 0.9rem; }
  .card p { font-size: 1.04rem; line-height: 1.74; margin-bottom: 0.9rem; }
  .card p:last-child { margin-bottom: 0; }
  .key { color: var(--a2); font-weight: 700; }        /* one emphasis colour, body face kept */
  .card strong { color: var(--a2); font-weight: 700; }
  .pull { border-left: 4px solid var(--a2); padding: 0.15rem 0 0.15rem 1rem; font-weight: 600; color: var(--ink); margin: 1.15rem 0; font-style: italic; }
  .figure { margin: 1rem 0 0.3rem; }
  .figure img { display: block; height: auto; border: 1px solid rgba(var(--ink-c),0.18); margin: 0 auto; }
  .figure.wide img { width: 100%; max-width: 460px; }
  .figure.portrait img { width: 100%; max-width: 320px; }
  .figure figcaption { font-family: var(--serif); font-size: 0.82rem; color: var(--fade); margin-top: 0.5rem; line-height: 1.55; text-align: center; }

  /* Carousel */
  .car-wrap { margin: 0.4rem 0 0; }
  .car-prompt { font-family: var(--sans); font-size: 0.82rem; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .car-frame { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.14); border-top: 3px solid var(--a1); padding: 1.4rem 1.35rem; min-height: 8.5rem; display: flex; align-items: center; }
  .car-card { font-size: 1.06rem; line-height: 1.7; width: 100%; }
  .car-card .cc-lead { font-family: var(--sans); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--clay); display: block; margin-bottom: 0.5rem; }
  .car-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 0.9rem; gap: 1rem; }
  .car-dots { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .car-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(var(--ink-c),0.2); }
  .car-dot.read { background: var(--a2); }
  .car-dot.here { outline: 2px solid var(--a1); outline-offset: 2px; }
  .car-count { font-family: var(--sans); font-size: 0.78rem; color: var(--fade); font-weight: 600; }
  .car-btns { display: flex; gap: 0.5rem; }
  .car-btn { font-family: var(--sans); width: 2.4rem; height: 2.4rem; background: var(--paper); border: 1px solid rgba(var(--ink-c),0.28); color: var(--ink); font-size: 1.1rem; cursor: pointer; }
  .car-btn:disabled { opacity: 0.32; cursor: not-allowed; }

  /* Stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit,minmax(120px,1fr)); gap: 0.8rem; margin: 0.5rem 0 0.2rem; }
  .stat { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-top: 3px solid var(--a2); padding: 1.1rem 0.7rem; text-align: center; }
  .stat-num { font-family: var(--serif); font-size: 2rem; font-weight: 800; color: var(--a2); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-family: var(--sans); font-size: 0.72rem; letter-spacing: 0.06em; color: var(--fade); margin-top: 0.5rem; line-height: 1.4; }

  /* Key terms + memory boxes (collapsed) */
  /* Key terms strip: label + individual expandable chips */
  .kt { margin-top: 1.3rem; }
  .kt-label { font-family: var(--sans); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--a1); padding-top: 0.85rem; border-top: 1px dashed rgba(var(--fade-c),0.4); }
  .kt-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.85rem; }
  .kt-term { border: 1px solid rgba(var(--ink-c),0.24); background: transparent; }
  .kt-term summary { font-family: var(--sans); font-size: 0.92rem; font-weight: 600; color: var(--ink); cursor: pointer; list-style: none; padding: 0.55rem 0.85rem; display: inline-flex; align-items: center; gap: 0.5rem; }
  .kt-term summary::-webkit-details-marker { display: none; }
  .kt-term summary::after { content: "+"; color: var(--a1); font-weight: 800; font-size: 1.05rem; }
  .kt-term[open] { display: block; width: 100%; }
  .kt-term[open] summary::after { content: "\2212"; }
  .kt-def { font-size: 0.94rem; line-height: 1.62; color: var(--mute2); padding: 0 0.85rem 0.75rem; }

  /* Remember box (collapsed) */
  .remember { margin-top: 0.9rem; border-top: 1px dashed rgba(var(--fade-c),0.4); padding-top: 0.7rem; }
  .remember summary { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; letter-spacing: 0.04em; color: var(--a1); cursor: pointer; list-style: none; }
  .remember summary::-webkit-details-marker { display: none; }
  .remember summary::before { content: "+ "; font-weight: 800; }
  .remember[open] summary::before { content: "\2212 "; }
  .remember .disc-body { font-size: 0.96rem; line-height: 1.68; color: var(--mute1); margin-top: 0.6rem; background: rgba(var(--a2-c),0.06); border-left: 3px solid var(--a2); padding: 0.7rem 0.9rem; }

  /* Sources */
  .source { position: relative; background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-top: 3px solid var(--a2); box-shadow: 6px 6px 0 rgba(var(--a2-c),0.13); padding: 1.2rem 1.3rem; margin: 1.15rem 0 1.6rem; }
  .source-attr { font-family: var(--sans); font-size: 0.8rem; color: var(--clay); font-weight: 600; margin-bottom: 0.75rem; line-height: 1.5; }
  .source-body { font-size: 1.02rem; line-height: 1.74; }
  .source-body em { color: var(--a2); font-style: italic; }
  .toggle-btn { font-family: var(--sans); background: transparent; border: none; color: var(--a1); cursor: pointer; font-size: 0.88rem; font-weight: 600; text-decoration: underline; padding: 0.7rem 0 0; }
  .toggle-body { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed rgba(var(--fade-c),0.45); font-size: 0.94rem; color: var(--mute2); line-height: 1.66; }
  .toggle-body.open { display: block; }

  /* Questions */
  .q-text { font-size: 1.16rem; line-height: 1.5; font-weight: 600; margin-bottom: 1.2rem; }
  .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.2rem; }
  .option { display: flex; align-items: flex-start; gap: 0.85rem; padding: 1rem 1.05rem; background: var(--sand); border: 1px solid rgba(var(--ink-c),0.13); cursor: pointer; font-family: var(--serif); text-align: left; font-size: 0.99rem; line-height: 1.55; color: var(--ink); width: 100%; }
  .option:hover:not(:disabled) { background: var(--cut); border-color: var(--a1); }
  .option:disabled { cursor: default; }
  .option.selected { background: var(--cut); border-color: var(--a1); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.correct { background: var(--opt-correct-bg); border-color: var(--a2); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.wrong { background: var(--opt-wrong-bg); border-color: var(--clay); border-width: 2px; padding: 0.94rem 0.99rem; }
  .option.dimmed { opacity: 0.46; }
  .opt-letter { font-family: var(--serif); font-weight: 800; color: var(--a1); min-width: 1.1rem; }
  .opt-text { flex: 1; }
  .opt-mark { font-weight: 700; font-size: 1.1rem; }
  .explanation { background: var(--cut); border: 1px solid rgba(var(--ink-c),0.12); border-left: 5px solid var(--a2); padding: 1.15rem 1.2rem; }
  .expl-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.5rem; }
  .expl-text { line-height: 1.7; font-size: 0.96rem; }
  .chip { display: inline-block; font-family: var(--sans); padding: 0.22rem 0.65rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .chip-argue { background: var(--chip-argue-bg); color: var(--chip-argue-fg); }
  .chip-evidence { background: var(--chip-argue-bg); color: var(--chip-argue-fg); }
  .chip-weigh { background: var(--a2); color: #F0E3CF; }
  .chip-instinct { background: var(--chip-instinct-bg); color: var(--clay); }
  .q-meta { margin-bottom: 0.9rem; }

  /* order + sort interactions */
  .inter { margin: 0.4rem 0 1rem; }
  .inter-pool { display: flex; flex-direction: column; gap: 0.5rem; }
  .inter-item { font-family: var(--serif); text-align: left; padding: 0.85rem 1rem; background: var(--sand); border: 1px solid rgba(var(--ink-c),0.16); cursor: pointer; font-size: 0.97rem; line-height: 1.5; color: var(--ink); display: flex; gap: 0.7rem; align-items: baseline; }
  .inter-item:hover:not(:disabled) { border-color: var(--a1); background: var(--cut); }
  .inter-item .rank { font-family: var(--sans); font-weight: 800; color: var(--a1); min-width: 1.4rem; }
  .inter-placed { background: var(--cut); border-color: var(--a2); }
  .inter-item.ok { background: var(--opt-correct-bg); border-color: var(--a2); }
  .inter-item.no { background: var(--opt-wrong-bg); border-color: var(--clay); }
  .sort-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .sort-col { background: var(--sort-bg); border: 1px dashed rgba(var(--ink-c),0.28); padding: 0.7rem; min-height: 4rem; }
  .sort-col h4 { font-family: var(--sans); font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.6rem; text-align: center; }
  .sort-btns { display: flex; gap: 0.4rem; margin-top: 0.5rem; }
  .sort-place { font-family: var(--sans); flex: 1; font-size: 0.78rem; font-weight: 700; padding: 0.4rem; background: var(--paper); border: 1px solid rgba(var(--ink-c),0.24); cursor: pointer; color: var(--ink); }

  /* Running summary */
  .runsum { background: rgba(var(--a2-c),0.08); border: 1px solid rgba(var(--a2-c),0.28); border-left: 5px solid var(--a2); padding: 1.3rem 1.4rem; }
  .runsum-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.9rem; }
  .runsum ol { margin: 0; padding-left: 1.3rem; }
  .runsum li { font-size: 1.02rem; line-height: 1.66; margin-bottom: 0.7rem; color: var(--ink); }
  .runsum li:last-child { margin-bottom: 0; }
  .runsum li.fresh { font-weight: 700; color: var(--a2); }

  /* Popup */
  .pop-back { position: fixed; inset: 0; background: rgba(var(--ink-c),0.5); display: flex; align-items: center; justify-content: center; padding: 1.5rem; z-index: 50; }
  .pop { background: var(--paper); border-top: 5px solid var(--a2); padding: 1.6rem 1.5rem; max-width: 30rem; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .pop-label { font-family: var(--sans); font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 0.8rem; }
  .pop-text { font-size: 1.1rem; line-height: 1.6; font-weight: 600; color: var(--ink); margin-bottom: 1.3rem; }
  .pop-btn { font-family: var(--sans); width: 100%; padding: 0.9rem; background: var(--a2); border: none; color: #F7F1E4; font-size: 0.98rem; font-weight: 700; cursor: pointer; }

  /* Nav */
  .nav { display: flex; justify-content: space-between; gap: 0.8rem; margin-top: 1rem; }
  .btn-secondary { font-family: var(--sans); padding: 0.8rem 1.2rem; background: transparent; border: 1px solid rgba(var(--ink-c),0.28); color: var(--ink); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .btn-secondary:hover:not(:disabled) { background: var(--paper); }
  .btn-primary { font-family: var(--sans); padding: 0.85rem 1.5rem; background: var(--a2); border: none; color: #F7F1E4; font-size: 0.95rem; cursor: pointer; font-weight: 700; }
  .btn-primary:hover:not(:disabled) { background: var(--a2-hover); }
  .btn-primary:disabled { opacity: 0.34; cursor: not-allowed; }

  /* Results */
  .results-head { text-align: center; margin-bottom: 1.8rem; }
  .results-eyebrow { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--clay); font-weight: 700; margin-bottom: 0.8rem; }
  .results-title { font-family: var(--sans); font-size: clamp(1.9rem,5.5vw,2.7rem); font-weight: 800; letter-spacing: -0.02em; }
  .score-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 0.9rem; margin-bottom: 1.4rem; }
  .score-block { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); border-top: 4px solid var(--a1); padding: 1.3rem 0.8rem; text-align: center; }
  .score-num { font-family: var(--serif); font-size: 2.6rem; font-weight: 800; color: var(--ink); line-height: 1; letter-spacing: -0.03em; }
  .score-den { font-family: var(--serif); font-size: 1.1rem; color: var(--fade); font-weight: 500; }
  .score-word { font-family: var(--serif); font-size: 1.3rem; font-weight: 800; color: var(--a2); line-height: 2; }
  .score-label { font-family: var(--sans); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fade); margin-top: 0.5rem; font-weight: 700; }
  .grade-desc { text-align: center; margin-bottom: 1.6rem; padding: 0 0.5rem; line-height: 1.66; }
  .breakdown { background: var(--paper); border: 1px solid rgba(var(--ink-c),0.12); padding: 1.3rem; margin-bottom: 1.4rem; }
  .breakdown-label { font-family: var(--sans); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--a2); font-weight: 700; margin-bottom: 1rem; text-align: center; }
  .bd-row { display: grid; grid-template-columns: 1fr 110px 46px; gap: 0.7rem; align-items: center; margin-bottom: 0.7rem; font-family: var(--serif); font-size: 0.9rem; }
  .bd-name { font-weight: 600; }
  .bd-bar { height: 9px; background: rgba(var(--ink-c),0.08); overflow: hidden; }
  .bd-fill { height: 100%; background: var(--a2); }
  .bd-score { color: var(--fade); text-align: right; font-weight: 700; }
  .results-actions { display: flex; gap: 0.8rem; margin-top: 1.6rem; }
  .results-actions button { flex: 1; }
  .hidden { display: none !important; }

#kula-mode-toggle, .mode-toggle { min-height: 44px !important; padding-top: 0.6rem !important; padding-bottom: 0.6rem !important; box-sizing: border-box !important; }
#next-btn, #begin-btn, #kdone-btn, #kretake-btn { min-height: 44px !important; }

  .cover-title, .results-title, .story-num { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; }
  .cover-title { line-height: 1.08; }
  .btn-primary, .pop-btn { color: var(--on-a2); }
  .option.dimmed { opacity: 0.82; }
  body.dark .option.dimmed { opacity: 0.86; }
  ul.plain, ol.plain { margin: 0.2rem 0 1rem 1.3rem; padding: 0; }
  .plain li { font-size: 1.04rem; line-height: 1.66; margin-bottom: 0.6rem; }
  .plain li:last-child { margin-bottom: 0; }
  .stat-after { margin-top: 1rem; }

  /* Slide diagrams */
  .markbar { display: flex; gap: 3px; margin: 0.2rem 0 1.1rem; }
  .markbar span { padding: 0.6rem 0.2rem; text-align: center; font-family: var(--sans); font-weight: 700; font-size: 0.78rem; line-height: 1.2; color: var(--ink); }
  .markbar .m1 { background: rgba(var(--a2-c),0.18); }
  .markbar .m2 { background: rgba(var(--a2-c),0.38); }
  .markbar .m3 { background: var(--a2); color: var(--on-a2); }
  .labpath { display: flex; gap: 4px; margin: 0.2rem 0 1.1rem; }
  .labpath span { flex: 1; min-width: 0; padding: 0.55rem 0; text-align: center; font-family: var(--sans); font-weight: 800; font-size: 0.82rem; background: rgba(var(--ink-c),0.08); color: var(--ink); }
  .labpath .end { flex: 1.9; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; background: transparent; outline: 1px solid rgba(var(--ink-c),0.3); outline-offset: -1px; }
  .labpath .five { background: var(--a2); color: var(--on-a2); }

  /* Hook: spend one hour */
  .story.spend { justify-content: flex-start; min-height: 0; }
  .spend-lead { font-size: 1.24rem; line-height: 1.5; font-weight: 600; margin-bottom: 0.3rem; }
  .spend-hint { font-family: var(--sans); font-size: 0.92rem; color: var(--mute1); margin-bottom: 1.1rem; }
  .spend-bar { display: grid; grid-template-columns: repeat(6,1fr); gap: 4px; margin-bottom: 0.55rem; }
  .seg { height: 14px; background: rgba(var(--ink-c),0.14); transition: background 0.25s ease; }
  .seg.on { background: var(--ink); }
  .seg.in { background: var(--a1); }
  .seg.out { background: var(--a2); }
  .spend-bar.big .seg { height: 24px; }
  .spend-note { font-family: var(--sans); font-size: 0.84rem; color: var(--mute2); font-weight: 600; margin-bottom: 0.9rem; min-height: 1.3rem; line-height: 1.45; }
  .spend-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.1rem; }
  .spend-row { display: flex; gap: 0.4rem; }
  .spend-add { flex: 1; display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; min-height: 48px; padding: 0.7rem 0.9rem; background: var(--paper); border: 1px solid rgba(var(--ink-c),0.16); border-left: 5px solid rgba(var(--ink-c),0.2); font-family: var(--serif); font-size: 1rem; line-height: 1.35; color: var(--ink); text-align: left; cursor: pointer; }
  .spend-row.has .spend-add { border-left-color: var(--ink); }
  .spend-n { font-family: var(--sans); font-size: 0.78rem; font-weight: 700; color: var(--mute2); white-space: nowrap; }
  .spend-row.has .spend-n { color: var(--ink); }
  .spend-sub-btn { flex: 0 0 48px; min-height: 48px; background: transparent; border: 1px solid rgba(var(--ink-c),0.3); color: var(--ink); font-size: 1.3rem; cursor: pointer; }
  .spend-sub-btn:disabled { opacity: 0.25; cursor: default; }
  .spend-legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; font-family: var(--sans); font-size: 0.84rem; font-weight: 700; margin-bottom: 1.5rem; }
  .dot { display: inline-block; width: 10px; height: 10px; margin-right: 0.45rem; }
  .dot.in { background: var(--a1); }
  .dot.out { background: var(--a2); }
  .skip-link.spend-again { margin: 0.4rem 0 0; min-height: 44px; text-align: left; }

  /* Plan builder: pick three questions */
  .pick-tabs { display: grid; grid-template-columns: 1fr 1fr; margin: 0.4rem 0 0.9rem; border: 1px solid rgba(var(--ink-c),0.3); }
  .pick-tab { min-height: 44px; font-family: var(--sans); font-weight: 700; font-size: 0.9rem; background: transparent; border: none; color: var(--ink); cursor: pointer; }
  .pick-tab.on { background: var(--ink); color: var(--on-ink); }
  .pick-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .pick-item { display: flex; align-items: center; gap: 0.75rem; min-height: 52px; padding: 0.7rem 0.85rem; background: var(--sand); border: 2px solid transparent; outline: 1px solid rgba(var(--ink-c),0.14); outline-offset: -1px; cursor: pointer; text-align: left; color: var(--ink); font-family: var(--serif); font-size: 1rem; line-height: 1.35; width: 100%; }
  .pick-item.on { background: var(--cut); border-color: var(--a2); outline: none; }
  .pick-box { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; border: 2px solid rgba(var(--ink-c),0.45); display: inline-flex; align-items: center; justify-content: center; font-family: var(--sans); font-weight: 800; font-size: 0.95rem; }
  .pick-item.on .pick-box { background: var(--a2); border-color: var(--a2); color: var(--on-a2); }
  .pick-t { flex: 1; }
  .pick-k { flex: 0 0 auto; font-family: var(--sans); font-size: 0.64rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute2); }
  .pick-msg { margin-top: 0.9rem; font-family: var(--sans); font-size: 0.9rem; font-weight: 700; color: var(--mute1); min-height: 1.4rem; line-height: 1.45; }
  .pick-msg.good { color: var(--a2); }
  .pick-msg.warn { color: var(--clay); }

  /* Closing screen: the plan */
  .breakdown .breakdown-label { text-align: left; }
  .plan-row { padding: 0.95rem 0; border-top: 1px solid rgba(var(--ink-c),0.12); }
  .plan-row:first-of-type { border-top: none; padding-top: 0.1rem; }
  .plan-row:last-child { padding-bottom: 0; }
  .plan-name { font-family: var(--sans); font-weight: 800; font-size: 1.06rem; margin-bottom: 0.5rem; }
  .plan-route { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.55rem; }
  .route-step { display: inline-flex; align-items: center; gap: 0.45rem; font-family: var(--sans); font-size: 0.82rem; font-weight: 700; padding: 0.32rem 0.65rem; background: rgba(var(--a2-c),0.13); color: var(--ink); }
  .route-step b { color: var(--a2); }
  .route-arrow { color: var(--fade); }
  .plan-how { font-size: 0.96rem; line-height: 1.6; color: var(--mute1); }
  ul.dates { margin-bottom: 0; }
  .dates li { font-size: 0.98rem; }
  .plan-after { font-size: 0.95rem; color: var(--mute1); margin-top: 0.8rem; line-height: 1.6; }

  /* Mobile: 44px tap targets, sort columns stack */
  .car-btn { width: 44px; height: 44px; }
  .sort-place { min-height: 44px; }
  .sort-col .inter-item { width: 100%; margin-bottom: 0.4rem; }
  .sort-col .inter-item:last-child { margin-bottom: 0; }
  .kt-term summary { min-height: 44px; }
  .remember summary { min-height: 44px; display: flex; align-items: center; gap: 0.35rem; }
  .toggle-btn { min-height: 44px; }
  .btn-secondary, .btn-primary { min-height: 44px; }
  body { padding-bottom: 5.5rem; }   /* room to scroll the nav clear of the fixed mode toggle */
  @media (max-width: 560px) { .sort-cols { grid-template-columns: 1fr; } .cover-title { font-size: clamp(2.6rem,13vw,3.6rem); } }
</style>

<style>#kula-mode-toggle{position:fixed;bottom:1.1rem;right:1.1rem;z-index:40;display:inline-flex;align-items:center;gap:.45em;padding:.48rem .82rem;border-radius:999px;font-family:var(--sans);font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:1;background:#FFFFFF;color:#35494C;border:1px solid rgba(10,42,44,.2);box-shadow:0 2px 8px rgba(0,0,0,.10);transition:transform .15s ease,box-shadow .15s ease}#kula-mode-toggle:hover{transform:translateY(-1px)}#kula-mode-toggle svg{width:15px;height:15px;display:block;flex:0 0 auto}body.dark #kula-mode-toggle{background:#123235;color:#CFE0E1;border-color:rgba(247,236,241,.2)}</style><button id="kula-mode-toggle" type="button" onclick="kulaToggle()" aria-label="Switch between light and dark mode"><span id="kmt-icon"></span><span id="kmt-label"></span></button><script>(function(){var MOON="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z'/></svg>",SUN="<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='4.2'/><path d='M12 1.6v2M12 20.4v2M3.6 12h-2M22.4 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4'/></svg>",K="kula-mode";function paint(){var d=document.body.classList.contains("dark");var ic=document.getElementById("kmt-icon"),la=document.getElementById("kmt-label");if(ic)ic.innerHTML=d?SUN:MOON;if(la)la.textContent=d?"Light mode":"Dark mode"}window.kulaToggle=function(){document.body.classList.toggle("dark");try{localStorage.setItem(K,document.body.classList.contains("dark")?"dark":"light")}catch(e){}paint()};var s=null;try{s=localStorage.getItem(K)}catch(e){}var dark=(s==="dark"||s==="light")?s==="dark":!!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(dark)document.body.classList.add("dark");paint();})();</script>
<div class="container">
  <div class="top-bar hidden" id="top-bar">
    <div class="top-meta" style="margin-bottom:0"><span id="lesson-tag">Kula Revise · Grade 12 History · Study Smart</span></div>
  </div>
  <div id="stage"></div>
  <div class="nav hidden" id="nav">
    <button class="btn-secondary" id="back-btn">&larr; Back</button>
    <button class="btn-primary" id="next-btn">Continue &rarr;</button>
  </div>
</div>

<script>
const PAPERS = [
  {
    "name": "Paper 1",
    "topics": [
      { "t": "Origins of the Cold War", "k": "source" },
      { "t": "Independent Africa: Angola", "k": "source" },
      { "t": "US Civil Rights Movement", "k": "source" },
      { "t": "The Cold War: Vietnam", "k": "essay" },
      { "t": "Independent Africa: the Congo", "k": "essay" },
      { "t": "Black Power Movement", "k": "essay" }
    ]
  },
  {
    "name": "Paper 2",
    "topics": [
      { "t": "Crisis of Apartheid in the 1980s", "k": "source" },
      { "t": "The TRC", "k": "source" },
      { "t": "Globalisation", "k": "source" },
      { "t": "Black Consciousness", "k": "essay" },
      { "t": "The Coming of Democracy", "k": "essay" },
      { "t": "The End of the Cold War", "k": "essay" }
    ]
  }
];
const CLOSE = {
  "eyebrow": "Kula Revise · Study Smart",
  "title": "Your Plan",
  "intro": "Write this plan down, or take a screenshot. Keep it where you study.",
  "routes": {
    "source": {
      "steps": ["Study Lab", "Practice Lab"],
      "how": "Do the Study Lab in order. Then do the Practice Lab with your notes closed, and sort every mistake by its cause."
    },
    "essay": {
      "steps": ["Study Lab", "Essay Lab"],
      "how": "Do the Study Lab in order. Then write the essay in the Essay Lab, read the feedback, and write it again."
    }
  },
  "after": "Then build a plan for the other paper in the same way.",
  "change": "Change my plan",
  "finish": "Continue"
};
const FLOW = [
  {
    "type": "pick",
    "tag": "Your plan",
    "heading": "Choose your three questions",
    "prompt": "Tap three topics. You need at least one source-based question and at least one essay.",
    "kinds": { "source": "Source-based", "essay": "Essay" },
    "msg": {
      "count": "Chosen: {n} of 3.",
      "noEssay": "You have three source-based questions. Swap one for an essay.",
      "noSource": "You have three essays. Swap one for a source-based question.",
      "ok": "That works: {s} source-based and {e} essay.",
      "full": "You already have three. Tap one of them to take it out."
    },
    "next": "See my plan"
  }
];

// Engine for the single-activity web apps (hour hook, sort, plan builder).
// Same renderers as the lesson engine. Each app holds one activity, reports `completed`
// when the activity is finished, and reports `advance` only from its last button.

const stage = document.getElementById("stage");
const nav = document.getElementById("nav");
const nextBtn = document.getElementById("next-btn");
const backBtn = document.getElementById("back-btn");

let state = { interState: {}, answers: {}, revealed: {}, plan: null };
const ITEM = FLOW[0];

function esc(s){
  return String(s).replace(/[&<>"]/g, (c, i, str) => {
    if(c === "&"){
      const rest = str.slice(i);
      if(/^&(#\d+|#x[0-9a-fA-F]+|[a-zA-Z]+);/.test(rest)) return "&";
    }
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function markDone(){ kulaEmbed('completed'); }
function leave(){ kulaEmbed('advance'); }

function setNext(label, enabled, fn){
  nav.classList.remove("hidden");
  backBtn.style.visibility = "hidden";
  nextBtn.style.display = "";
  nextBtn.innerHTML = `${esc(label)} &rarr;`;
  nextBtn.disabled = !enabled;
  nextBtn.onclick = fn;
}

// ============ HOOK: SPEND ONE HOUR ============
function renderSpend(item){
  const st = state.interState.spend || (state.interState.spend = {counts:item.choices.map(()=>0), done:false, seen:false});
  const used = st.counts.reduce((a,b)=>a+b,0);
  const head = `
      <div class="story-num">${esc(item.marker)}</div>
      <div class="story-unit">${esc(item.markerLabel)}</div>
      <div class="story-rule"></div>`;

  if(!st.done){
    const segs = Array.from({length:item.blocks},(_,i)=>`<span class="seg ${i<used?"on":""}"></span>`).join("");
    const rows = item.choices.map((c,i)=>`
        <div class="spend-row ${st.counts[i]?"has":""}">
          <button class="spend-add" data-add="${i}"><span class="spend-t">${esc(c.t)}</span><span class="spend-n">${st.counts[i]?st.counts[i]*10+" min":"+ 10 min"}</span></button>
          <button class="spend-sub-btn" data-sub="${i}" aria-label="Take ten minutes back from ${esc(c.t)}" ${st.counts[i]?"":"disabled"}>&minus;</button>
        </div>`).join("");
    const note = used===item.blocks ? item.full : `${used*10} of ${item.blocks*10} minutes spent.`;
    stage.innerHTML = `
      <div class="story spend">
        ${head}
        <div class="spend-lead">${esc(item.lead)}</div>
        <div class="spend-hint">${esc(item.sub)}</div>
        <div class="spend-bar" aria-hidden="true">${segs}</div>
        <div class="spend-note" id="spend-note">${esc(note)}</div>
        <div class="spend-list">${rows}</div>
      </div>`;
    stage.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
      if(used>=item.blocks) return;
      st.counts[parseInt(b.dataset.add,10)]++; renderSpend(item);
    });
    stage.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{
      const i=parseInt(b.dataset.sub,10);
      if(st.counts[i]>0){ st.counts[i]--; renderSpend(item); }
    });
    setNext(item.go, used===item.blocks, ()=>{ st.done=true; window.scrollTo({top:0,behavior:"instant"}); renderSpend(item); });
    return;
  }

  let inB=0, outB=0;
  item.choices.forEach((c,i)=>{ if(c.side==="in") inB+=st.counts[i]; else outB+=st.counts[i]; });
  const segs = Array.from({length:item.blocks},(_,i)=>`<span class="seg ${i<inB?"in":"out"}"></span>`).join("");
  const r = item.reveal;
  const last = outB*10>=40 ? r.high : (outB*10>=20 ? r.mid : r.low);
  const fill = s=>s.replace("{in}", inB*10).replace("{out}", outB*10);
  const lines = [fill(r.in), fill(r.out), r.collide, last];
  const html = lines.map((l,i)=>`<div class="story-line${i===lines.length-1?" last":""}${st.seen?" vis":""}">${esc(l)}</div>`).join("");
  stage.innerHTML = `
    <div class="story spend">
      ${head}
      <div class="spend-bar big" aria-hidden="true">${segs}</div>
      <div class="spend-legend">
        <span><i class="dot in"></i>${esc(item.labels.in)} · ${inB*10} min</span>
        <span><i class="dot out"></i>${esc(item.labels.out)} · ${outB*10} min</span>
      </div>
      ${html}
      <button class="skip-link spend-again" id="spend-again">${esc(item.again)}</button>
    </div>`;
  document.getElementById("spend-again").onclick=()=>{
    state.interState.spend={counts:item.choices.map(()=>0), done:false, seen:false};
    renderSpend(item);
  };
  setNext(item.next, st.seen, leave);
  if(!st.seen){
    const els=[...stage.querySelectorAll(".story-line")];
    els.forEach((el,i)=>setTimeout(()=>{
      if(!document.body.contains(el)) return;
      el.classList.add("vis");
      if(i===els.length-1){ st.seen=true; markDone(); setNext(item.next, true, leave); }
    }, 650*(i+1)));
  }
}

// ============ SORT ============
function renderSort(item){
  const answered = state.revealed.sort;
  const st = state.interState.sort || (state.interState.sort={col:{}});
  const col = st.col;                              // content index -> 0/1
  const unplaced = item.items.map((_,i)=>i).filter(i=>!(i in col));
  const colCards = (which)=>item.items.map((it,ci)=>{
    if(col[ci]!==which) return "";
    let cls="inter-item inter-placed";
    if(answered) cls="inter-item "+(item.answer[ci]===which?"ok":"no");
    return `<button class="${cls}" data-un="${ci}" ${answered?"disabled":""}><span>${esc(it)}</span></button>`;
  }).join("");
  const pool = unplaced.map(ci=>`
    <div class="inter-item" style="flex-direction:column;align-items:stretch;cursor:default;">
      <span>${esc(item.items[ci])}</span>
      <div class="sort-btns">
        <button class="sort-place" data-place="${ci}" data-col="0">${esc(item.cols[0])}</button>
        <button class="sort-place" data-place="${ci}" data-col="1">${esc(item.cols[1])}</button>
      </div>
    </div>`).join("");
  stage.innerHTML = `
    <div class="card">
      <div class="q-meta"><span class="chip chip-instinct">${esc(item.chip)}</span></div>
      <div class="q-text">${item.q}</div>
      <div class="inter">
        <div class="sort-cols">
          <div class="sort-col"><h4>${esc(item.cols[0])}</h4>${colCards(0)}</div>
          <div class="sort-col"><h4>${esc(item.cols[1])}</h4>${colCards(1)}</div>
        </div>
        ${unplaced.length?`<div style="height:1px;background:rgba(var(--ink-c),0.14);margin:0.9rem 0;"></div><div class="inter-pool">${pool}</div>`:""}
      </div>
      ${answered?`<div class="explanation"><div class="expl-label">Why</div><div class="expl-text">${item.explanation}</div></div>`:""}
    </div>`;
  if(!answered){
    stage.querySelectorAll("[data-place]").forEach(b=>b.onclick=()=>{ col[parseInt(b.dataset.place,10)]=parseInt(b.dataset.col,10); renderSort(item); });
    stage.querySelectorAll("[data-un]").forEach(b=>b.onclick=()=>{ delete col[parseInt(b.dataset.un,10)]; renderSort(item); });
    setNext("Check", unplaced.length===0, ()=>{
      state.revealed.sort=true; markDone(); renderSort(item);
      const ex = stage.querySelector(".explanation");
      if(ex && ex.scrollIntoView) ex.scrollIntoView({block:"nearest", behavior:"smooth"});
    });
  } else {
    setNext(item.next, true, leave);
  }
}

// ============ PLAN BUILDER: PICK THREE QUESTIONS ============
function planValid(){
  if(!state.plan || state.plan.chosen.length!==3) return false;
  const ks = state.plan.chosen.map(i=>PAPERS[state.plan.paper].topics[i].k);
  return ks.includes("source") && ks.includes("essay");
}
function renderPick(item){
  window.scrollTo({top:0,behavior:"instant"});
  drawPick(item);
}
function drawPick(item){
  if(!state.plan) state.plan={paper:0, chosen:[]};
  const plan = state.plan, paper = PAPERS[plan.paper];
  const st = state.interState.pick || (state.interState.pick={note:""});
  const tabs = PAPERS.map((p,i)=>`<button class="pick-tab ${i===plan.paper?"on":""}" data-paper="${i}" aria-pressed="${i===plan.paper}">${esc(p.name)}</button>`).join("");
  const rows = paper.topics.map((t,i)=>{
    const on = plan.chosen.includes(i);
    return `<button class="pick-item ${on?"on":""}" data-topic="${i}" aria-pressed="${on}"><span class="pick-box">${on?"&#10003;":""}</span><span class="pick-t">${esc(t.t)}</span><span class="pick-k">${esc(item.kinds[t.k])}</span></button>`;
  }).join("");
  const ks = plan.chosen.map(i=>paper.topics[i].k);
  const s = ks.filter(k=>k==="source").length, e = ks.filter(k=>k==="essay").length;
  let msg, cls="";
  if(st.note){ msg=st.note; cls="warn"; }
  else if(plan.chosen.length<3) msg=item.msg.count.replace("{n}", plan.chosen.length);
  else if(e===0){ msg=item.msg.noEssay; cls="warn"; }
  else if(s===0){ msg=item.msg.noSource; cls="warn"; }
  else { msg=item.msg.ok.replace("{s}", s).replace("{e}", e); cls="good"; }
  st.note="";
  stage.innerHTML = `
    <div class="card">
      ${item.tag?`<div class="stage-tag">${esc(item.tag)}</div>`:""}
      <h2>${esc(item.heading)}</h2>
      <p>${esc(item.prompt)}</p>
      <div class="pick-tabs">${tabs}</div>
      <div class="pick-list">${rows}</div>
      <div class="pick-msg ${cls}" id="pick-msg" role="status">${esc(msg)}</div>
    </div>`;
  stage.querySelectorAll("[data-paper]").forEach(b=>b.onclick=()=>{
    const p=parseInt(b.dataset.paper,10);
    if(p!==plan.paper){ plan.paper=p; plan.chosen=[]; }
    drawPick(item);
  });
  stage.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{
    const i=parseInt(b.dataset.topic,10);
    if(plan.chosen.includes(i)) plan.chosen=plan.chosen.filter(x=>x!==i);
    else if(plan.chosen.length>=3) st.note=item.msg.full;
    else plan.chosen.push(i);
    drawPick(item);
  });
  setNext(item.next, planValid(), ()=>showPlan(item));
}

function showPlan(item){
  window.scrollTo({top:0,behavior:"instant"});
  nav.classList.add("hidden");
  const plan = state.plan, paper = PAPERS[plan.paper];
  const topics = plan.chosen.slice().sort((a,b)=>a-b).map(i=>paper.topics[i]);
  const rows = topics.map(t=>{
    const r = CLOSE.routes[t.k];
    const steps = r.steps.map((s,i)=>`<span class="route-step"><b>${i+1}</b>${esc(s)}</span>`).join(`<span class="route-arrow">&rarr;</span>`);
    return `<div class="plan-row"><div class="plan-name">${esc(t.t)}</div><div class="plan-route">${steps}</div><div class="plan-how">${esc(r.how)}</div></div>`;
  }).join("");
  stage.innerHTML = `
    <div class="results-head">
      <div class="results-eyebrow">${esc(CLOSE.eyebrow)}</div>
      <h1 class="results-title">${esc(CLOSE.title)}</h1>
    </div>
    <div class="grade-desc">${esc(CLOSE.intro)}</div>
    <div class="breakdown plan">
      <div class="breakdown-label">${esc(paper.name)}</div>
      ${rows}
      <p class="plan-after">${esc(CLOSE.after)}</p>
    </div>
    <div class="results-actions">
      <button class="btn-secondary" id="change-btn">${esc(CLOSE.change)}</button>
      <button class="btn-primary" id="finish-btn">${esc(CLOSE.finish)} &rarr;</button>
    </div>`;
  document.getElementById("change-btn").onclick = ()=>renderPick(item);
  document.getElementById("finish-btn").onclick = leave;
  markDone();
}

// ============ START ============
(function start(){
  document.getElementById("top-bar").classList.remove("hidden");
  if(ITEM.type==="spend") renderSpend(ITEM);
  else if(ITEM.type==="sort") renderSort(ITEM);
  else renderPick(ITEM);
})();

</script>
</body>
</html>
